# Lets OpenChoreo's data-plane cluster-agent apply the CRs the resource types render:
# the FoundryVectorStore / FoundryAgent CRs (this provider) and the ASO CognitiveServices
# Deployment/Account CRs. Apply once, alongside the provider.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openchoreo-foundry-dataplane-access
rules:
  - apiGroups: ["foundry.openchoreo.dev"]
    resources: ["foundryagents", "foundryagents/status", "foundryvectorstores", "foundryvectorstores/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cognitiveservices.azure.com"]
    resources: ["deployments", "deployments/status", "accounts", "accounts/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openchoreo-foundry-dataplane-access
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: openchoreo-foundry-dataplane-access}
subjects:
  - {kind: ServiceAccount, name: cluster-agent-dataplane, namespace: openchoreo-data-plane}
