# Provisions a vector store inside an existing Azure AI Foundry project.
# A vector store is a data-plane object (no ARM type), so the Crossplane
# provider in ../provider reconciles it via a FoundryVectorStore CR:
# create / heal / delete, with a finalizer for clean teardown.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: azure-foundry-vector-store
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        # Display name for the vector store in Foundry. Defaults to the Resource
        # name. The store's real identity is a generated vs_... id; consumers
        # resolve it at runtime by listing vector stores and matching this name.
        storeName:
          type: string
          description: Name for the vector store (defaults to the Resource name).
  retainPolicy: Delete

  # Consumers get the store name (to resolve the id) and the project endpoint.
  outputs:
    - name: storeName
      value: "${parameters.?storeName.orValue(metadata.resourceName)}"
    - name: endpoint
      configMapKeyRef:
        name: foundry-account
        key: projectEndpoint

  resources:
    - id: vectorStore
      readyWhen: "${has(applied.vectorStore.status.conditions) && applied.vectorStore.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: foundry.openchoreo.dev/v1alpha1
        kind: FoundryVectorStore
        metadata:
          name: ${metadata.name}          # FoundryVectorStore is cluster-scoped
        spec:
          forProvider:
            storeName: ${parameters.?storeName.orValue(metadata.resourceName)}
