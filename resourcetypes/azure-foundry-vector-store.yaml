# Provisions a vector store inside an existing Azure AI Foundry project.
# A vector store is a data-plane object (no ARM type), so the Crossplane provider in
# ../provider reconciles it via a FoundryVectorStore CR: create / heal / delete, with a
# finalizer for clean teardown.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: azure-foundry-vector-store
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        # Display name for the store in Foundry. Defaults to the Resource name.
        storeName:
          type: string
          description: Name for the vector store (defaults to the Resource name).

  # Per-environment infra, set by the platform engineer on the binding. The developer
  # never supplies these.
  environmentConfigs:
    openAPIV3Schema:
      type: object
      required: [projectEndpoint]
      properties:
        projectEndpoint:
          type: string
          description: Foundry project endpoint for this environment.

  retainPolicy: Delete

  outputs:
    - name: storeName
      value: "${parameters.?storeName.orValue(metadata.resourceName)}"
    # The real vs_... id, surfaced from the provider's status after creation.
    - name: vectorStoreId
      value: "${applied.vectorStore.status.atProvider.id}"
    - name: endpoint
      value: "${environmentConfigs.projectEndpoint}"

  resources:
    - id: vectorStore
      readyWhen: "${has(applied.vectorStore.status.conditions) && applied.vectorStore.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: foundry.openchoreo.dev/v1alpha1
        kind: FoundryVectorStore
        metadata:
          name: ${metadata.name}          # FoundryVectorStore is cluster-scoped
        spec:
          forProvider:
            projectEndpoint: ${environmentConfigs.projectEndpoint}
            storeName: ${parameters.?storeName.orValue(metadata.resourceName)}
