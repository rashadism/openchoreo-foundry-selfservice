# One-time platform-engineer setup.
#
# The Crossplane provider resolves the Foundry project endpoint from this ConfigMap
# (in the provider's namespace). The resource types themselves take the endpoint and the
# account ARM id per-environment via the binding's resourceTypeEnvironmentConfigs (see
# app/openchoreo/deploy.yaml), so no Azure detail is baked into a resource type.
#
# Change the values below for your environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: foundry-account
  namespace: provider-foundry
data:
  projectEndpoint: https://rashad20-9496-resource.services.ai.azure.com/api/projects/rashad20-9496
